[package]
name = "tuvi-web"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread"] }
topcoat = { version = "0.12.1", default-features = false, features = ["asset", "compression", "cookie", "discover", "font-fontsource", "icon-iconify", "l10n", "l10n-fluent", "router", "runtime", "serve", "tailwind", "view"] }

tuvi-core.workspace = true

[build-dependencies]
topcoat = { version = "0.12.1", default-features = false, features = ["icon-iconify", "tailwind"] }

[dev-dependencies]
serde_urlencoded = "0.7"
