# Checks every push and pull request. On main, after the checks pass, it
# asks Render to deploy (when the RENDER_DEPLOY_HOOK_URL secret is set). A
# manual run on main ("Run workflow" in the Actions tab) deploys too.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test, translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the Topcoat CLI
        run: cargo install topcoat-cli --version 0.12.1 --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check translations
        working-directory: crates/tuvi-web
        run: topcoat l10n check

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: thien-hac:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and open the home page
        run: |
          docker run -d --name app -p 3000:3000 thien-hac:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:3000/ | grep -q 'data-cast'
          curl -fsS -o /dev/null http://localhost:3000/card/1996-04-15-22-nu
          docker logs app

  deploy:
    name: Deploy to Render
    needs: [check, image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Call the Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set: skipping the deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Render deploy started."
