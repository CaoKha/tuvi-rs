# Checks every push and pull request in four parallel jobs: format and lint,
# tests, the Docker image and the Android APK. On main, after they pass, it
# asks Render to deploy (when the RENDER_DEPLOY_HOOK_URL secret is set) and
# publishes the APK as the `android-latest` GitHub release. A manual run on
# main ("Run workflow" in the Actions tab) does both too.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install the Topcoat CLI
        run: cargo install topcoat-cli --version 0.12.1 --locked
      - name: Check translations
        working-directory: crates/tuvi-web
        run: topcoat l10n check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: thien-hac:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and open the home page
        run: |
          docker run -d --name app -p 3000:3000 thien-hac:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:3000/ | grep -q 'data-cast'
          curl -fsS -o /dev/null http://localhost:3000/card/1996-04-15-22-nu
          docker logs app

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Install the Topcoat CLI
        run: cargo install topcoat-cli --version 0.12.1 --locked
      - name: Build the server for Android
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" android/build-rust.sh
      # Without the secret the APK is signed with a throwaway key: it installs,
      # but only after you uninstall the previous build.
      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set: signing with a throwaway key."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/thien-hac.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: thien-hac-apk
          path: thien-hac.apk
          if-no-files-found: error

  release-apk:
    name: Release the APK
    needs: [lint, test, android]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: thien-hac-apk
      # One release that always holds the newest APK, so its download link
      # never changes.
      - name: Replace the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest thien-hac.apk \
            --target "$GITHUB_SHA" \
            --title "Android 0.1.$GITHUB_RUN_NUMBER" \
            --notes "Built from $GITHUB_SHA. On your phone, download thien-hac.apk and open it to install."

  deploy:
    name: Deploy to Render
    needs: [lint, test, image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Call the Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set: skipping the deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Render deploy started."
